<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Atomic Lead Engine</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header>
  <div class="brand"><span class="logo">⚛</span> Atomic Lead Engine</div>
  <nav>
    <button class="tab active" data-view="next">Next lead</button>
    <button class="tab" data-view="pipeline">Pipeline</button>
    <button class="tab" data-view="registrations">New registrations</button>
  </nav>
  <select id="customer" title="Customer" hidden></select>
  <div id="status" class="status">Loading…</div>
</header>

<main>
  <section id="view-next">
    <div id="lead"></div>
  </section>

  <section id="view-pipeline" hidden>
    <div class="toolbar">
      <select id="filter">
        <option value="">All analyzed</option>
        <option value="new">New</option>
        <option value="saved">Saved</option>
        <option value="contacted">Contacted</option>
        <option value="won">Won</option>
        <option value="not_fit">Not a fit</option>
        <option value="skipped">Skipped</option>
      </select>
      <button id="discover" class="secondary">Find more leads now</button>
      <a id="export" class="button secondary" href="/api/export.csv">Export CSV</a>
    </div>
    <table id="table">
      <thead><tr><th>Score</th><th>Business</th><th>Industry</th><th>Top opportunity</th><th>Status</th></tr></thead>
      <tbody></tbody>
    </table>
  </section>

  <section id="view-registrations" hidden>
    <div class="toolbar">
      <label class="check"><input type="checkbox" id="reg-all"> Show all areas and industries</label>
      <button id="reg-import" class="secondary">Import downloaded Sunbiz files</button>
    </div>
    <p class="muted" id="reg-help"></p>
    <div id="reg-imports"></div>
    <table id="reg-table">
      <thead><tr><th>Filed</th><th>Name</th><th>Type</th><th>City (as filed)</th><th>Category</th><th>Flags</th><th>Known business</th><th></th></tr></thead>
      <tbody></tbody>
    </table>
  </section>
</main>

<footer>Business data © <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap contributors</a> (ODbL). Website checks read public pages only and honor robots.txt.</footer>

<template id="lead-tpl">
  <article class="card">
    <div class="lead-head">
      <div>
        <h1 class="name"></h1>
        <div class="meta"></div>
      </div>
      <div class="score"><span class="num"></span><span class="grade"></span></div>
    </div>
    <p class="summary"></p>
    <section class="evidence" hidden>
      <h3>Strongest evidence</h3>
      <div class="ev-title"></div>
      <dl class="ev-fields"></dl>
      <p class="ev-explain"></p>
    </section>
    <section class="verify" hidden><h3>Verify before contacting</h3><ul></ul></section>
    <div class="grid">
      <div class="contact"><h3>Contact</h3><ul></ul></div>
      <div class="observations"><h3>Other observations</h3><div class="obs-list"></div></div>
    </div>
    <details class="sources-panel" open>
      <summary><h3>Details &amp; sources</h3></summary>
      <div class="ws-block"></div>
      <table class="detail-table"><tbody></tbody></table>
      <h4>Source records</h4>
      <ul class="source-list"></ul>
      <details class="raw-tags"><summary>All source tags</summary><pre></pre></details>
    </details>
    <div class="brief" hidden><h3>AI brief</h3><div class="brief-body"></div></div>
    <label class="notes-label">Notes<textarea class="notes" rows="2" placeholder="Call notes, who you spoke with…"></textarea></label>
    <div class="actions">
      <button data-act="contacted">✓ Mark contacted</button>
      <button data-act="saved" class="secondary">Save for later</button>
      <button data-act="not_fit" class="secondary">Not a fit</button>
      <button data-act="skipped" class="ghost">Skip →</button>
      <span class="spacer"></span>
      <button data-act="brief" class="secondary ai">✨ Write AI brief</button>
      <button data-act="reanalyze" class="ghost">Re-check site</button>
    </div>
  </article>
</template>

<script src="/static/app.js"></script>
</body>
</html>
